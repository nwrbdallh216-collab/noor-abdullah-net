<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة نور & عبدالله - ترحيب وتسجيل الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .welcome-banner {
            margin-bottom: 25px;
        }
        .welcome-banner h1 {
            font-size: 26px;
            color: #00f2fe;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .welcome-banner p {
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.6;
        }
        .net-status {
            background: rgba(0, 242, 254, 0.1);
            border: 1px dashed rgba(0, 242, 254, 0.4);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            color: #00f2fe;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #e5e7eb;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .form-group input:focus {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        .form-group input::placeholder {
            color: #9ca3af;
            letter-spacing: normal;
        }
        .btn-connect {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-connect:hover {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="welcome-banner">
            <h1>✨ أهلاً بكم في شبكة نور وعبدالله ✨</h1>
            <p>نُرحب باتصالكم. تصفحوا الإنترنت بسرعة وأمان عبر إدخال كرت الدخول الخاص بكم.</p>
        </div>

        <div class="net-status">
            📶 متصل بنظام كروت الشبكة الذكية
        </div>

        <!-- فورم تسجيل الدخول المتوافق مع المايكروتك -->
        <form action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="code">رقم كرت الدخول:</label>
                <input type="text" id="code" name="username" placeholder="XXXXX-XXXXX" required autocomplete="off">
            </div>

            <button type="submit" class="btn-connect">اتصال بالإنترنت</button>
        </form>

        <div class="footer-note">
            <p>جميع الحقوق محفوظة © شبكة نور & عبدالله 2026</p>
        </div>
    </div>

</body>
</html>
